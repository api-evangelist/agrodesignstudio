generated: '2026-09-13'
method: probed
source: https://www.agrobox.jp/_api/mcp
name: AgroDesign Studios — Site MCP servers
description: >-
  Two live, unauthenticated remote MCP endpoints served from hosts AgroDesign Studios
  (株式会社アグロデザイン・スタジオ) controls: the AgroBox structural-biology service site and the
  AgroDesign.SHOP lab-equipment store. Both are Wix "Site Visitor Assistant" servers —
  the MCP surface is PLATFORM-AUTHORED by the Wix site builder, not written by
  AgroDesign Studios, and it exposes the generic Wix site/commerce toolset rather than
  any contract specific to the company's protein-structure-analysis business. It is
  recorded here because it is a real agent surface reachable at the company's own
  hostnames, but it must not be read as a first-party API.

deployment:
  mode: remote
  endpoint: https://www.agrobox.jp/_api/mcp
  auth: none
  verified: probed

platform_authored: true
platform: Wix Site MCP
platform_docs: https://dev.wix.com/docs/develop-websites/articles/get-started/about-the-wix-site-mcp

