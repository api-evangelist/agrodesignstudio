aid: agrodesignstudio
name: AgroDesign Studios
description: >-
  AgroDesign Studios (株式会社アグロデザイン・スタジオ) is a Japanese structural-biology startup founded
  30 March 2018 by CEO Yuki Nishigaya, based in the University of Tokyo Kashiwa-II campus
  industry-academia building in Kashiwa, Chiba. It applies protein and nucleic-acid 3D structure
  information to the discovery of molecular-targeted, environmentally safer crop-protection
  chemicals. Its commercial surface is contract research rather than software: the AgroBox®
  service brand sells X-ray crystallography, cryo-EM, fragment screening and structure-based drug
  design (SBDD) engagements, and AgroDesign.SHOP sells lab-automation robots, cultivation kits and
  experimental materials. The company publishes no first-party API, SDK or developer program; its
  only machine-callable agent surface is the Wix platform Site MCP endpoint served on each of its
  two Wix-hosted sites.
