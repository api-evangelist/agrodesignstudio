apis:
- name: AgroBox Site MCP
  description: >-
    A live, unauthenticated remote Model Context Protocol endpoint served at the AgroBox
    structural-biology service site. The server is the Wix "Site Visitor Assistant" — a
    PLATFORM-AUTHORED MCP surface generated by the Wix site builder, not written by AgroDesign
    Studios. It exposes nine generic Wix tools for searching the public site, fetching business
    details, and invoking Wix site/commerce APIs on behalf of an anonymous visitor. It is a real
    agent surface on a host the company controls; it is not a first-party API for the company's
    protein-structure-analysis service.
  humanURL: https://www.agrobox.jp/
  image: https://static.wixstatic.com/media/a7776e_4c1c9094741c45dd9391de482e580aeb~mv2.jpg/v1/fill/w_446,h_234,al_c/a7776e_4c1c9094741c45dd9391de482e580aeb~mv2.jpg
