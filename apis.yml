- name: AgroDesign.SHOP Site MCP
  description: >-
    The second live, unauthenticated remote MCP endpoint, served at the AgroDesign.SHOP
    storefront where the company sells lab-automation robot arms (as a UFACTORY xArm authorized
    reseller), Arabidopsis cultivation kits, seeds and experimental materials. Same Wix
    platform-authored "Site Visitor Assistant" server and same nine tools; because this host runs
    Wix Stores, the visitor-scoped CallWixSiteAPI tool can start a purchase.
  humanURL: https://www.agrodesign.shop/
